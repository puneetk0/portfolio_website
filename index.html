
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <!-- Every face in one request, discoverable by the preload scanner.
           Weights are exactly what the CSS asks for: 400/500/600 for both UI
           faces (500 was requested by the nav and the print titles and was
           being synthesised), Caveat 600 for the single handwritten mark, and
           Playfair italic for the `//` glyph. Geist 100 was dropped — it was
           downloaded and never referenced. -->
      <link
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Geist:wght@400;500;600&family=Caveat:wght@600&family=Playfair+Display:ital@1&display=swap"
        rel="stylesheet">
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <title>Puneet Kathuria | Product Designer & Engineer</title>
      <meta name="description" content="Portfolio of Puneet Kathuria, a product-minded Full-Stack Engineer and AI undergrad. Designing and building high-performance macOS apps, voice interfaces, and fintech solutions." />
      <meta property="og:title" content="Puneet Kathuria | Product Designer & Engineer" />
      <meta property="og:description" content="Portfolio of Puneet Kathuria, a product-minded Full-Stack Engineer and AI undergrad." />
      <meta property="og:type" content="website" />
      
      <!-- Structured Schema Markup (JSON-LD) for Search Engines -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Puneet Kathuria",
        "jobTitle": "Product Designer & Full-Stack Engineer",
        "url": "https://puneetk.dev",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Rishihood University (Newton School of Technology)"
        },
        "sameAs": [
          "https://github.com/puneetk0",
          "https://www.linkedin.com/in/puneet-kathuria-33a296220/",
          "https://instagram.com/puneet.25_"
        ]
      }
      </script>
      <!-- Resolve the theme BEFORE first paint. Without this, a light-mode
           visitor gets a dark flash on every page load. -->
      <script>
        (function () {
          try {
            var v = localStorage.getItem('portfolio-theme');
            var t = v === 'light' || v === 'dark' ? v : 'dark';
            document.documentElement.dataset.theme = t;
          } catch (e) {
            document.documentElement.dataset.theme = 'dark';
          }
        })();
      </script>
      <style>
        /* Only the pre-paint background, so there is no flash before the
           stylesheet lands. Everything else lives in src/styles/. */
        :root { background: #141414; }
        :root[data-theme='light'] { background: #f7f7f7; }
        html, body { min-height: 100%; margin: 0; }
        #root { min-height: 100%; }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
